name: Submit Downstream PRs

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit of web-shim-codegen to build'
        required: true
        type: string
      title_prefix:
        description: 'Conventional commit type for the downstream PR titles and commits'
        required: true
        type: string
      close_existing:
        description: 'Close open downstream PRs before a new PR is opened'
        required: false
        type: boolean
        default: false

env:
  TERM: xterm-256color

jobs:
  setup:
    # release.yml syncs the downstream repos after a release PR merges
    if: |
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore: Release')
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.version }}
      title_prefix: ${{ steps.title_prefix.outputs.title_prefix }}
    steps:
      - name: '[Setup] Checkout Repository'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: '[Setup] Vite+'
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: true

      - name: 'Get current web-shim-codegen version'
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 'Get downstream PR title prefix'
        id: title_prefix
        env:
          TITLE_PREFIX: ${{ inputs.title_prefix }}
        run: |
          if [ -z "$TITLE_PREFIX" ]; then
            case "$(git log -1 --format=%s)" in
              feat:* | feat\(* | feat!:*) TITLE_PREFIX=feat ;;
              fix:* | fix\(* | fix!:* | perf:* | perf\(* | perf!:*) TITLE_PREFIX=fix ;;
              *) TITLE_PREFIX=build ;;
            esac
          fi
          echo "title_prefix=$TITLE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: '[Setup] Build'
        run: vp run build

      - name: 'Upload dist artifacts'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  sync-repo:
    needs: setup
    name: ${{ matrix.sdk_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        include:
          - repo: onesignal-ngx
            sdk_name: angular
            dist_path: dist/onesignal-ngx.tgz
            clone_path: __clone/onesignal-ngx
          - repo: react-onesignal
            sdk_name: react
            dist_path: dist/react.tgz
            clone_path: __clone/react
          - repo: onesignal-vue
            sdk_name: vue2
            dist_path: dist/vue/v2.tgz
            clone_path: __clone/vue/v2
          - repo: onesignal-vue3
            sdk_name: vue3
            dist_path: dist/vue/v3.tgz
            clone_path: __clone/vue/v3
    steps:
      - name: '[Setup] Checkout Repository'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: '[Setup] Git'
        run: |
          git config --global user.email "noreply@onesignal.com"
          git config --global user.name "OneSignal"

      - name: 'Download dist artifacts'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: '[${{ matrix.repo }}] Checkout'
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PUSH_TOKEN }}
          repository: OneSignal/${{ matrix.repo }}
          fetch-depth: 0
          path: ${{ matrix.clone_path }}

      - name: '[${{ matrix.repo }}] Patch'
        run: |
          bash scripts/patch-repo.sh ${{ matrix.dist_path }} ${{ matrix.clone_path }} ${{ matrix.repo }}
        env:
          PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
          TITLE_PREFIX: ${{ needs.setup.outputs.title_prefix }}

      - name: '[${{ matrix.repo }}] Push'
        uses: ad-m/github-push-action@v1.1.0
        with:
          repository: OneSignal/${{ matrix.repo }}
          directory: ${{ matrix.clone_path }}
          force: true
          branch: cd_update
          github_token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: '[${{ matrix.repo }}] Submit PR'
        uses: ./.github/actions/create-pr
        with:
          owner: 'OneSignal'
          repo: ${{ matrix.repo }}
          package_version: ${{ needs.setup.outputs.package_version }}
          title_prefix: ${{ needs.setup.outputs.title_prefix }}
          close_existing: ${{ inputs.close_existing || false }}
          github_token: ${{ secrets.GH_PUSH_TOKEN }}
